<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;

/* ---------------------------- STORAGE LAYER ---------------------------- */
/* Uses window.storage when running inside a Claude artifact (shared across
   everyone who opens this artifact). Falls back to an in-memory store when
   that API isn't available (e.g. the raw .html file opened locally), so the
   app still works for solo testing. */

const memoryStore = {};
const hasRealStorage = typeof window !== "undefined" && !!window.storage;
const hasLocalStorage = (() => { try { return typeof window !== "undefined" && !!window.localStorage; } catch(e){ return false; } })();

async function loadShared(key, fallback){
  if(hasRealStorage){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }catch(e){ return fallback; }
  }
  if(hasLocalStorage){
    try{ const raw = localStorage.getItem("crucible_shared_"+key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
}
async function saveShared(key, value){
  if(hasRealStorage){
    try{ await window.storage.set(key, JSON.stringify(value), true); }catch(e){ console.error("storage save failed", e); }
    return;
  }
  if(hasLocalStorage){
    try{ localStorage.setItem("crucible_shared_"+key, JSON.stringify(value)); }catch(e){ console.error("storage save failed", e); }
    return;
  }
  memoryStore[key] = value;
}
async function loadPersonal(key, fallback){
  if(hasRealStorage){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }catch(e){ return fallback; }
  }
  if(hasLocalStorage){
    try{ const raw = localStorage.getItem("crucible_personal_"+key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  return memoryStore["p_"+key] !== undefined ? memoryStore["p_"+key] : fallback;
}
async function savePersonal(key, value){
  if(hasRealStorage){
    try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){ console.error("storage save failed", e); }
    return;
  }
  if(hasLocalStorage){
    try{ localStorage.setItem("crucible_personal_"+key, JSON.stringify(value)); }catch(e){ console.error("storage save failed", e); }
    return;
  }
  memoryStore["p_"+key] = value;
}

const CHALLENGE_KEY = "crucible_challenge";
const PARTICIPANTS_KEY = "crucible_participants";
const AUDIT_KEY_FOR = (day) => `crucible_audit_day_${day}`;
const CHECKLIST_KEY_FOR = (pid, day) => `crucible_checklist_${pid}_${day}`;

const ME_KEY = "crucible_me";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(name){ return (name||"").trim().split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2) || "?"; }
function randomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return "FORGE-" + s;
}
function computeDay(challenge){
  if(!challenge) return 1;
  const elapsed = Math.floor((Date.now() - challenge.createdAt) / (1000*60*60*24));
  return Math.min(challenge.totalDays, Math.max(1, elapsed + 1));
}

/* ---------------------------- SHARED UI ---------------------------- */

function TopBar({title, onBack, right}){
  return (
    <div className="topbar" style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
      <div style={{display:"flex", alignItems:"center", gap:12}}>
        {onBack && <button className="btn-ghost" onClick={onBack} style={{padding:4}}><Icon d={ICONS.arrowLeft} size={20}/></button>}
        <div className="eyebrow">{title}</div>
      </div>
      {right}
    </div>
  );
}
function Screen({children}){ return <div className="fade-in" style={{padding:"20px"}}>{children}</div>; }
function HeatBar({pct, height}){
  return (
    <div className="heat-bar-track" style={height?{height}:{}}>
      <div className="heat-bar-fill" style={{width:`${Math.max(0,Math.min(100,pct))}%`}}/>
    </div>
  );
}
function StatBlock({label, value, accent}){
  return (
    <div>
      <div className="eyebrow" style={{marginBottom:4}}>{label}</div>
      <div className="display" style={{fontSize:34, lineHeight:1, color: accent || "var(--bone)"}}>{value}</div>
    </div>
  );
}

function CreateChallenge({onBack, onCreate}){
  const [yourName, setYourName] = useState("");
  const [groupName, setGroupName] = useState("");
  const [days, setDays] = useState(30);
  const [rosterNames, setRosterNames] = useState([]);
  const [nameDraft, setNameDraft] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");

  const addName = () => {
    const n = nameDraft.trim();
    if(!n) return;
    if(rosterNames.some(x=>x.toLowerCase()===n.toLowerCase())){ setNameDraft(""); return; }
    setRosterNames([...rosterNames, n]);
    setNameDraft("");
  };
  const removeName = (n) => setRosterNames(rosterNames.filter(x=>x!==n));

  const submit = async () => {
    if(!yourName.trim()){ setError("Enter your name — you're the first Survivor."); return; }
    setError(""); setSubmitting(true);
    await onCreate({ yourName, groupName, days, rosterNames });
    setSubmitting(false);
  };

  const totalCount = 1 + rosterNames.filter(n=>n.trim().toLowerCase()!==yourName.trim().toLowerCase()).length;

  return (
    <div>
      <TopBar title="Create Challenge" onBack={onBack}/>
      <Screen>
        <div style={{display:"flex", flexDirection:"column", gap:20}}>
          <div>
            <label className="field-label">Your Name</label>
            <input type="text" placeholder="e.g. Marcus Webb" value={yourName} onChange={e=>setYourName(e.target.value)} />
          </div>
          <div>
            <label className="field-label">Group Name</label>
            <input type="text" placeholder="e.g. The Foundry" value={groupName} onChange={e=>setGroupName(e.target.value)} />
          </div>

          <div>
            <label className="field-label">Duration — Days</label>
            <div style={{display:"flex", gap:10, alignItems:"center"}}>
              <input type="range" min="7" max="180" step="1" value={days} onChange={e=>setDays(Number(e.target.value))} style={{flex:1, accentColor:"var(--ember)"}}/>
              <input type="number" min="7" max="365" value={days} onChange={e=>setDays(Math.max(1, Number(e.target.value)||1))} style={{width:76, textAlign:"center", padding:"10px 6px"}}/>
            </div>
            <div style={{fontSize:11, color:"var(--slag-dark)", marginTop:4}} className="mono">Not locked to 30 — set it to whatever the group agrees on.</div>
          </div>

          <div>
            <label className="field-label">Who's In It — {totalCount} {totalCount===1?"person":"people"}</label>
            <div style={{display:"flex", gap:8, marginBottom:10}}>
              <input type="text" placeholder="Add a name and hit enter" value={nameDraft}
                onChange={e=>setNameDraft(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); addName(); } }} />
              <button className="btn btn-outline" style={{padding:"0 18px"}} onClick={addName}>ADD</button>
            </div>
            <div className="card" style={{padding: rosterNames.length ? 10 : 16}}>
              <div style={{display:"flex", alignItems:"center", gap:12, padding:"6px 4px"}}>
                <div className="avatar" style={{width:28, height:28, fontSize:11}}>{initials(yourName||"?")}</div>
                <div style={{flex:1, fontSize:13, fontWeight:600}}>{yourName.trim() || "You"} <span className="mono" style={{fontSize:10, color:"var(--brass)"}}>· ADMIN</span></div>
              </div>
              {rosterNames.length===0 && (
                <div style={{fontSize:12, color:"var(--slag-dark)", padding:"10px 4px 4px"}}>No one else added yet — you can also just send the invite code out instead.</div>
              )}
              {rosterNames.map(n=>(
                <div key={n} style={{display:"flex", alignItems:"center", gap:12, padding:"6px 4px", borderTop:"1px solid var(--steel)"}}>
                  <div className="avatar" style={{width:28, height:28, fontSize:11}}>{initials(n)}</div>
                  <div style={{flex:1, fontSize:13}}>{n}</div>
                  <button className="btn-ghost" style={{padding:2}} onClick={()=>removeName(n)}><Icon d={ICONS.arrowLeft} size={14} style={{transform:"rotate(45deg)"}}/></button>
                </div>
              ))}
            </div>
            <div style={{fontSize:11, color:"var(--slag-dark)", marginTop:6}} className="mono">
              Everyone you add here still confirms their own spot by opening the app and entering their name — this just pre-loads the roster.
            </div>
          </div>

          <div className="card" style={{padding:16}}>
            <div className="eyebrow" style={{marginBottom:8}}>Overtime Rule</div>
            <div style={{fontSize:13, color:"var(--slag)", lineHeight:1.6}}>
              If survivors can't agree on a result at day {days}, all remaining participants may unanimously vote one 5-day extension. No eliminated participant may re-enter.
            </div>
          </div>
          {error && <div className="error-text">{error}</div>}
          <button className="btn btn-primary" onClick={submit} disabled={submitting}>{submitting ? "FORGING..." : "FORGE THE CHALLENGE"}</button>
        </div>
      </Screen>
    </div>
  );
}

function JoinChallenge({onBack, onJoin}){
  const [code, setCode] = useState("");
  const [yourName, setYourName] = useState("");
  const [mission, setMission] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if(!code.trim()){ setError("Enter the invite code your group creator sent you."); return; }
    if(!yourName.trim()){ setError("Enter your name."); return; }
    setError(""); setSubmitting(true);
    const res = await onJoin({ code, yourName, mission });
    setSubmitting(false);
    if(res && res.error) setError(res.error);
  };

  return (
    <div>
      <TopBar title="Join Challenge" onBack={onBack}/>
      <Screen>
        <div style={{display:"flex", flexDirection:"column", gap:20}}>
          <div>
            <label className="field-label">Invite Code</label>
            <input type="text" placeholder="e.g. FORGE-7X2K" value={code} onChange={e=>setCode(e.target.value.toUpperCase())} />
          </div>
          <div>
            <label className="field-label">Your Name</label>
            <input type="text" placeholder="e.g. Sasha Kim" value={yourName} onChange={e=>setYourName(e.target.value)} />
          </div>
          <div>
            <label className="field-label">Your 30-Day Mission (optional — can set later)</label>
            <input type="text" placeholder="e.g. Finish my portfolio" value={mission} onChange={e=>setMission(e.target.value)} />
          </div>
          {error && <div className="error-text">{error}</div>}
          <button className="btn btn-primary" onClick={submit} disabled={submitting}>{submitting ? "JOINING..." : "CONFIRM & ENTER"}</button>
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------- DASHBOARD ---------------------------- */

        <div className="pill pill-active"><span className="status-dot" style={{background:"var(--temper)"}}/>{active.length} SURVIVORS</div>

        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:18}}>

            <div className="eyebrow flicker" style={{color:"var(--ember)", marginBottom:6}}>CHALLENGE DAY — LIVE</div>

            <div style={{fontSize:13, color:"var(--slag)"}}>Submit your proof in the Vault before the window closes.</div>

        <div style={{marginTop:24}}>

            <Icon d={ICONS.target} size={18} strokeWidth={1.6}/>
            <div className="eyebrow" style={{marginTop:10, marginBottom:4}}>Mission</div>
            <div style={{fontSize:13, color:"var(--slag)"}}>{me.missionProgress}% complete</div>
          </button>
          <button onClick={()=>nav("vault")} className="card" style={{padding:16, textAlign:"left"}}>

            <div style={{fontSize:13, color:"var(--slag)"}}>Log today's proof</div>
          </button>
          <button onClick={()=>nav("roster")} className="card" style={{padding:16, textAlign:"left"}}>
            <Icon d={ICONS.users} size={18} strokeWidth={1.6}/>
            <div className="eyebrow" style={{marginTop:10, marginBottom:4}}>Roster</div>
            <div style={{fontSize:13, color:"var(--slag)"}}>{active.length} active · {participants.length-active.length} out</div>
          </button>
          {me.isAdmin ? (
            <button onClick={()=>nav("audit")} className="card" style={{padding:16, textAlign:"left", borderColor:"var(--ember-dim)"}}>

/* ---------------------------- CHECKLIST ---------------------------- */

function Checklist({checklist, onToggle, onBack}){
  const grouped = {};
  checklist.forEach(c=>{ (grouped[c.group] = grouped[c.group]||[]).push(c); });
  const doneCount = checklist.filter(c=>c.done).length;
  return (
    <div>
      <TopBar title="Daily Standard" onBack={onBack} right={<div className="mono" style={{fontSize:13, color:"var(--slag)"}}>{doneCount}/{checklist.length}</div>}/>
      <Screen>
        {Object.entries(grouped).map(([group, items])=>(
          <div key={group} style={{marginBottom:18}}>
            <div className="eyebrow" style={{marginBottom:4, color:"var(--ember)"}}>{group}</div>
            {items.map(item=>(
              <div className="checklist-row" key={item.id}>
                <button className={`checkbox ${item.done?"checked":""}`} onClick={()=>onToggle(item.id)}>
                  {item.done && <Icon d={ICONS.check} size={13} strokeWidth={3}/>}
                </button>
                <div style={{fontSize:15, color: item.done ? "var(--slag)" : "var(--bone)", textDecoration: item.done ? "line-through" : "none", lineHeight:1.4}}>{item.text}</div>
              </div>
            ))}
          </div>
        ))}
        <div className="card" style={{padding:16, marginTop:8, borderColor:"var(--temper)"}}>
          <div style={{fontSize:13, color:"var(--slag)", lineHeight:1.6}}>
            Illness, injury, family emergency, or unsafe conditions are valid exceptions — flag it with your admin instead of grinding through it.
          </div>
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------- MISSION ---------------------------- */

function Mission({me, proof, onSetMission, onLogProgress, onBack}){
  const [missionInput, setMissionInput] = useState(me.mission || "");
  const [log, setLog] = useState("");
  const [bump, setBump] = useState(10);
  const entries = proof.filter(p=>p.type==="Mission");

  if(!me.mission){
    return (
      <div>
        <TopBar title="Personal Mission" onBack={onBack}/>
        <Screen>
          <div style={{fontSize:13, color:"var(--slag)", marginBottom:16, lineHeight:1.6}}>
            Before Day 1 standards really count, lock in the one goal you're pushing for the whole run.
          </div>
          <label className="field-label">Your Mission</label>
          <input type="text" placeholder="e.g. Launch my Etsy shop" value={missionInput} onChange={e=>setMissionInput(e.target.value)} />
          <button className="btn btn-primary" style={{width:"100%", marginTop:14}} onClick={()=>missionInput.trim() && onSetMission(missionInput)}>LOCK IN MISSION</button>
        </Screen>
      </div>
    );
  }

  return (
    <div>
      <TopBar title="Personal Mission" onBack={onBack}/>
      <Screen>
        <div className="eyebrow" style={{marginBottom:8}}>Your goal</div>
        <div className="display" style={{fontSize:26, marginBottom:16, lineHeight:1.05}}>{me.mission}</div>
        <div style={{display:"flex", justifyContent:"space-between", marginBottom:6}}>
          <div className="eyebrow">Progress</div>
          <div className="mono" style={{fontSize:12, color:"var(--ember)"}}>{me.missionProgress}%</div>
        </div>
        <HeatBar pct={me.missionProgress}/>

        <div style={{marginTop:24}}>
          <label className="field-label">Log today's progress</label>
          <textarea rows={3} placeholder="What did you move forward today?" value={log} onChange={e=>setLog(e.target.value)}/>
          <div style={{display:"flex", alignItems:"center", gap:10, marginTop:10}}>
            <span className="mono" style={{fontSize:12, color:"var(--slag)"}}>+</span>
            <input type="number" min="0" max="100" value={bump} onChange={e=>setBump(Number(e.target.value))} style={{width:70}}/>
            <span className="mono" style={{fontSize:12, color:"var(--slag)"}}>%</span>
          </div>
          <button className="btn btn-primary" style={{width:"100%", marginTop:10}} onClick={()=>{ if(log.trim()){ onLogProgress(log, bump); setLog(""); } }}>LOG PROGRESS</button>
        </div>

        <div style={{marginTop:28}}>
          <div className="eyebrow" style={{marginBottom:12}}>History</div>
          {entries.length===0 && <div style={{fontSize:13, color:"var(--slag-dark)"}}>Nothing logged yet.</div>}
          {entries.map((e,i)=>(
            <div key={i} style={{display:"flex", gap:14, paddingBottom:16, marginBottom:16, borderBottom: i<entries.length-1 ? "1px solid var(--steel)" : "none"}}>
              <div className="mono" style={{fontSize:12, color:"var(--slag)", width:44, flexShrink:0}}>D{e.day}</div>
              <div style={{fontSize:14, lineHeight:1.5}}>{e.note}</div>
            </div>
          ))}
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------- PROOF VAULT ---------------------------- */

function Vault({proof, onAdd, onBack}){
  const typeIcon = {Workout: ICONS.flame, Meal: ICONS.camera, Mission: ICONS.target, "Screen Time": ICONS.clock};
  const [type, setType] = useState("Workout");
  const [note, setNote] = useState("");
  const [showForm, setShowForm] = useState(false);

  const submit = () => {
    if(!note.trim()) return;
    onAdd({type, note});
    setNote(""); setShowForm(false);
  };

  return (
    <div>
      <TopBar title="Proof Vault" onBack={onBack}/>
      <Screen>
        <div style={{fontSize:13, color:"var(--slag)", marginBottom:20, lineHeight:1.6}}>
          Every day you collect proof. You don't submit all of it publicly — only what's requested during a random audit.
        </div>

        {showForm && (
          <div className="card fade-in" style={{padding:16, marginBottom:16}}>
            <label className="field-label">Type</label>
            <select value={type} onChange={e=>setType(e.target.value)} style={{marginBottom:12}}>
              <option>Workout</option><option>Meal</option><option>Mission</option><option>Screen Time</option>
            </select>
            <label className="field-label">Note</label>
            <textarea rows={2} placeholder="What's the proof?" value={note} onChange={e=>setNote(e.target.value)} />
            <button className="btn btn-primary" style={{width:"100%", marginTop:10}} onClick={submit}>SAVE ENTRY</button>
          </div>
        )}

        {proof.length===0 && !showForm && <div style={{fontSize:13, color:"var(--slag-dark)", marginBottom:16}}>No proof logged yet.</div>}

        {proof.map((p,i)=>(
          <div key={i} className="card" style={{padding:16, marginBottom:12, display:"flex", gap:14, alignItems:"center"}}>
            <div style={{width:40, height:40, background:"var(--iron)", border:"1px solid var(--steel-light)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, color:"var(--ember)"}}>
              <Icon d={typeIcon[p.type] || ICONS.camera} size={18} strokeWidth={1.6}/>
            </div>
            <div style={{flex:1}}>
              <div style={{display:"flex", justifyContent:"space-between"}}>
                <div style={{fontWeight:700, fontSize:14}}>{p.type}</div>
                <div className="mono" style={{fontSize:11, color:"var(--slag)"}}>DAY {p.day}</div>
              </div>
              <div style={{fontSize:13, color:"var(--slag)", marginTop:2}}>{p.note}</div>
            </div>
          </div>
        ))}
        {!showForm && <button className="btn btn-outline" style={{width:"100%", marginTop:8}} onClick={()=>setShowForm(true)}>+ ADD PROOF ENTRY</button>}
      </Screen>
    </div>
  );
}

/* ---------------------------- AUDIT ---------------------------- */

function AuditDraw({participants, onBack, onDraw, onGoReview, existingAudit}){
  const [spinning, setSpinning] = useState(false);
  const [selectedParticipant, setSelectedParticipant] = useState(
    existingAudit ? participants.find(p=>p.id===existingAudit.selectedId) : null
  );

  const runDraw = () => {
    setSpinning(true);
    setSelectedParticipant(null);
    setTimeout(async ()=>{
      const picked = await onDraw();
      setSpinning(false);
      setSelectedParticipant(picked);
    }, 1900);
  };

  return (
    <div>
      <TopBar title="Random Audit" onBack={onBack}/>
      <Screen>
        <div style={{minHeight:"60vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:28}}>
          <div style={{
              width:220, height:220, borderRadius:"50%",
              border:"3px solid var(--steel-light)",
              display:"flex", alignItems:"center", justifyContent:"center",
              position:"relative",
              background:"conic-gradient(from 0deg, var(--iron), var(--steel), var(--iron), var(--steel), var(--iron))",
              animation: spinning ? "spin 1.9s cubic-bezier(.2,.8,.3,1) forwards" : "none",
              boxShadow: selectedParticipant ? "0 0 40px var(--ember-glow)" : "none",
              transition:"box-shadow .4s ease"
            }}>
            <div style={{width:180, height:180, borderRadius:"50%", background:"var(--void)", display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column"}}>
              {!spinning && !selectedParticipant && <Icon d={ICONS.shield} size={40} strokeWidth={1.3}/>}
              {spinning && <div className="mono eyebrow" style={{color:"var(--ember)"}}>SELECTING</div>}
              {selectedParticipant && (
                <div style={{textAlign:"center"}}>
                  <div className="eyebrow" style={{color:"var(--ember)", marginBottom:6}}>AUDIT SELECTED</div>
                  <div className="display" style={{fontSize:26}}>{selectedParticipant.name.split(" ")[0].toUpperCase()}</div>
                </div>
              )}
            </div>
          </div>

          {!spinning && !selectedParticipant && (
            <button className="btn btn-primary" onClick={runDraw}>DRAW TODAY'S AUDIT</button>
          )}
          {selectedParticipant && (
            <div style={{width:"100%", display:"flex", flexDirection:"column", gap:10}}>
              <div className="card" style={{padding:16, textAlign:"center"}}>
                <div style={{fontSize:13, color:"var(--slag)"}}>Selected participant must submit proof within</div>
                <div className="display mono" style={{fontSize:28, color:"var(--ember)", marginTop:4}}>2:00:00</div>
              </div>
              <button className="btn btn-primary" onClick={()=>onGoReview(selectedParticipant)}>VIEW ADMIN REVIEW →</button>
            </div>
          )}
          {!selectedParticipant && !spinning && (
            <div style={{fontSize:12, color:"var(--slag)", textAlign:"center", maxWidth:280}}>
              Everyone stays eligible every day — the same person can be pulled multiple days running.
            </div>
          )}
        </div>
      </Screen>
    </div>
  );
}

function AdminReview({selected, onBack, onResolved}){
  const [decision, setDecision] = useState(null);
  const proofs = [
    {type:"Screen Time", note:"Ask them to show their screen-time screenshot here."},
    {type:"Workout Video", note:"Ask for today's workout clip, timestamp visible."},
    {type:"Meal Photo", note:"Ask for today's whole-food meal photos."},
  ];
  if(!selected) return null;
  return (
    <div>
      <TopBar title="Admin Review" onBack={onBack}/>
      <Screen>
        <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:20}}>
          <div className="avatar">{selected.initials}</div>
          <div>
            <div style={{fontWeight:700}}>{selected.name}</div>
            <div className="mono" style={{fontSize:11, color:"var(--slag)"}}>PULLED FOR AUDIT</div>
          </div>
        </div>

        {proofs.map((p,i)=>(
          <div key={i} className="card" style={{padding:16, marginBottom:12}}>
            <div className="eyebrow" style={{marginBottom:6, color:"var(--ember)"}}>{p.type}</div>
            <div style={{height:120, background:"var(--iron)", border:"1px dashed var(--steel-light)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:10, color:"var(--slag-dark)"}}>
              <Icon d={ICONS.camera} size={26} strokeWidth={1.3}/>
            </div>
            <div style={{fontSize:13, color:"var(--slag)"}}>{p.note}</div>
          </div>
        ))}

        {!decision ? (
          <div style={{display:"flex", flexDirection:"column", gap:10, marginTop:8}}>
            <button className="btn btn-primary" onClick={()=>setDecision("pass")}>PASS</button>
            <button className="btn btn-outline" onClick={()=>setDecision("exception")}>VALID EXCEPTION</button>
            <button className="btn" style={{background:"var(--ember-dim)", color:"var(--bone)"}} onClick={()=>setDecision("eliminated")}>ELIMINATED</button>
          </div>
        ) : (
          <div className="card fade-in" style={{padding:18, textAlign:"center", marginTop:8}}>
            <div className="eyebrow" style={{marginBottom:8, color: decision==="eliminated" ? "var(--ember)" : "var(--temper)"}}>
              {decision==="pass" && "RULING: PASS"}
              {decision==="exception" && "RULING: VALID EXCEPTION"}
              {decision==="eliminated" && "RULING: ELIMINATED"}
            </div>
            <div style={{fontSize:13, color:"var(--slag)", marginBottom:16}}>
              {decision==="eliminated" ? `${selected.name} is removed from active standing. They remain on the roster, marked eliminated.` : `${selected.name} continues in the Crucible.`}
            </div>
            <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>onResolved(decision)}>CONFIRM & CLOSE</button>
          </div>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------- ROSTER ---------------------------- */

              <div style={{fontSize:12, color:"var(--slag)", marginTop:2}}>{p.claimed ? (p.mission || "No mission set yet") : "Hasn't opened the app yet"}</div>

                <div style={{flex:1}}>

            ))}
          </React.Fragment>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------- LEADERBOARD ---------------------------- */

function Leaderboard({participants, onBack}){
  const ranked = [...participants].filter(p=>p.status==="active").sort((a,b)=>scoreOf(b)-scoreOf(a));
  return (
    <div>
      <TopBar title="Leaderboard" onBack={onBack}/>
      <Screen>
        <div className="card" style={{padding:14, marginBottom:20}}>
          <div className="eyebrow" style={{marginBottom:8}}>Scoring</div>
          <div style={{fontSize:12, color:"var(--slag)", lineHeight:1.8}} className="mono">
            35% Consistency · 30% Mission · 20% Challenge Days · 10% Leadership · 5% Reflection
          </div>
        </div>
        {ranked.length===0 && <div style={{fontSize:13, color:"var(--slag-dark)"}}>No active survivors yet.</div>}
        {ranked.map((p,i)=>(
          <div key={p.id} className="card" style={{padding:14, marginBottom:8, display:"flex", alignItems:"center", gap:14}}>
            <div className="display" style={{fontSize:26, width:34, color: i<3 ? "var(--brass)" : "var(--slag)"}}>{i+1}</div>
            <div className="avatar">{p.initials}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700, fontSize:14}}>{p.name}</div>
              <div style={{fontSize:12, color:"var(--slag)"}}>{p.compliance}% compliance · {p.missionProgress}% mission</div>
            </div>
            <div className="display mono" style={{fontSize:20}}>{scoreOf(p).toFixed(1)}</div>
          </div>
        ))}
      </Screen>
    </div>
  );
}

/* ---------------------------- CHALLENGE DAY ---------------------------- */

function ChallengeDayScreen({day, onBack}){
  const info = CHALLENGE_DAYS[day] || CHALLENGE_DAYS[30];
  return (
    <div>
      <TopBar title={`Day ${day} Standard`} onBack={onBack}/>
      <Screen>
        <div className="eyebrow flicker" style={{color:"var(--ember)", marginBottom:8}}>CHALLENGE DAY</div>
        <div className="display" style={{fontSize:44, lineHeight:0.95, marginBottom:20}}>{info.name.toUpperCase()}</div>
        <div className="card" style={{padding:20, marginBottom:20}}>
          <div className="eyebrow" style={{marginBottom:10}}>The Standard</div>
          <div style={{fontSize:15, lineHeight:1.7}}>{info.desc}</div>
        </div>
        <div className="card" style={{padding:20, marginBottom:20, borderColor:"var(--temper)"}}>
          <div className="eyebrow" style={{marginBottom:10, color:"var(--temper)"}}>Non-Negotiable</div>
          <div style={{fontSize:13, color:"var(--slag)", lineHeight:1.7}}>
            Water, food, rest, and injury-safety rules still apply in full. No reward for restriction, dehydration, sleep deprivation, or training through injury.
          </div>
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------- RULES ---------------------------- */

function RulesScreen({onBack}){
  return (
    <div>
      <TopBar title="Daily Standard — Rules" onBack={onBack}/>
      <Screen>
        {RULE_GROUPS.map((g,i)=>(
          <div key={i} style={{marginBottom:22}}>
            <div className="eyebrow" style={{marginBottom:10, color:"var(--ember)"}}>{g.group}</div>
            {g.rules.map((r,j)=>(
              <div key={j} style={{display:"flex", gap:10, marginBottom:10, fontSize:14, lineHeight:1.5}}>
                <div style={{color:"var(--slag-dark)"}}>—</div>
                <div>{r}</div>
              </div>
            ))}
          </div>
        ))}
        <div className="card" style={{padding:16, borderColor:"var(--temper)"}}>
          <div className="eyebrow" style={{marginBottom:8, color:"var(--temper)"}}>Valid Exceptions</div>
          <div style={{fontSize:13, color:"var(--slag)", lineHeight:1.6}}>Illness, injury, family emergencies, unsafe conditions, and unavoidable school obligations don't count as failures.</div>
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------- PODIUM ---------------------------- */

function Podium({participants, onBack}){
  const finishers = [...participants].filter(p=>p.status==="active").sort((a,b)=>scoreOf(b)-scoreOf(a));
  const order = finishers.length>=5 ? [1,0,2] : finishers.length>=3 ? [0,1] : finishers.length>0 ? [0] : [];
  const heights = [140,180,110];
  const titles = [
    {label:"Crucible Champion", who: finishers[0]},
    {label:"Most Improved", who: finishers[Math.min(3,finishers.length-1)]},
    {label:"Best Leader", who: [...finishers].sort((a,b)=>b.leadership-a.leadership)[0]},
    {label:"Iron Discipline", who: [...finishers].sort((a,b)=>b.compliance-a.compliance)[0]},
  ];
  return (
    <div>
      <TopBar title="Final Results" onBack={onBack}/>
      <Screen>
        <div style={{textAlign:"center", marginBottom:28}}>
          <div className="eyebrow" style={{color:"var(--ember)", marginBottom:6}}>CRUCIBLE COMPLETE</div>
          <div className="display" style={{fontSize:34}}>{finishers.length} FINISHERS</div>
        </div>

        {finishers.length>0 ? (
          <div style={{display:"flex", alignItems:"flex-end", justifyContent:"center", gap:10, marginBottom:32}}>
            {order.map((idx,pos)=>{
              const p = finishers[idx]; if(!p) return null;
              return (
                <div key={idx} style={{textAlign:"center", width:100}}>
                  <div className="avatar" style={{margin:"0 auto 8px", width:48, height:48, border: idx===0 ? "2px solid var(--brass)" : "1px solid var(--steel-light)"}}>{p.initials}</div>
                  <div style={{fontSize:12, fontWeight:700, marginBottom:8}}>{p.name.split(" ")[0]}</div>
                  <div style={{height:heights[pos], background: idx===0 ? "linear-gradient(180deg, var(--brass), var(--iron))" : "var(--steel)", display:"flex", alignItems:"flex-start", justifyContent:"center", paddingTop:10}}>
                    <div className="display" style={{fontSize:30}}>{idx+1}</div>
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          <div className="card" style={{padding:20, textAlign:"center", marginBottom:24}}>No finishers this run — everyone was eliminated. No winner.</div>
        )}

        <div className="eyebrow" style={{marginBottom:12}}>Achievement Titles</div>
        {titles.map((t,i)=>t.who && (
          <div key={i} className="card" style={{padding:14, marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <div className="pill pill-brass"><Icon d={ICONS.medal} size={13}/>{t.label}</div>
            <div style={{fontWeight:700, fontSize:13}}>{t.who.name}</div>
          </div>
        ))}
      </Screen>
    </div>
  );
}

/* ---------------------------- PROFILE ---------------------------- */

function Profile({me, participants, onBack, onSwitch}){
  const rank = [...participants].filter(p=>p.status==="active").sort((a,b)=>scoreOf(b)-scoreOf(a)).findIndex(p=>p.id===me.id) + 1;
  return (
    <div>
      <TopBar title="Profile" onBack={onBack}/>
      <Screen>
        <div style={{display:"flex", alignItems:"center", gap:16, marginBottom:24}}>
          <div className="avatar" style={{width:60, height:60, fontSize:18}}>{me.initials}</div>
          <div>
            <div className="display" style={{fontSize:24}}>{me.name}</div>
            <div className="mono" style={{fontSize:12, color:"var(--slag)"}}>{me.isAdmin ? "ADMIN" : "PARTICIPANT"}</div>
          </div>
        </div>
        <div style={{display:"flex", gap:24, marginBottom:24}}>
          <StatBlock label="Compliance" value={`${me.compliance}%`} accent="var(--temper)"/>
          <StatBlock label="Status" value={me.status==="active"?"IN":"OUT"} accent={me.status==="active"?"var(--temper)":"var(--ember)"}/>
          <StatBlock label="Rank" value={rank>0?`#${rank}`:"—"} accent="var(--brass)"/>
        </div>
        <button className="btn btn-outline" style={{width:"100%"}} onClick={onSwitch}>NOT YOU? SWITCH IDENTITY</button>
      </Screen>
    </div>
  );
}

/* ---------------------------- LOADING ---------------------------- */
function Loading(){
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center"}}>
      <div className="eyebrow flicker" style={{color:"var(--ember)"}}>LOADING THE CRUCIBLE...</div>
    </div>
  );
}

/* ---------------------------- APP ROOT ---------------------------- */

function App(){
  const [phase, setPhase] = useState("loading");
  const [screen, setScreen] = useState("dashboard");
  const [challenge, setChallenge] = useState(null);
  const [participants, setParticipants] = useState([]);
  const [meId, setMeId] = useState(null);
  const [checklist, setChecklist] = useState(freshChecklist());
  const [proof, setProof] = useState([]);
  const [audit, setAudit] = useState(null);
  const [auditSelected, setAuditSelected] = useState(null);

  useEffect(()=>{ init(); }, []);

  async function init(){
    const [ch, parts, localMe] = await Promise.all([
      loadShared(CHALLENGE_KEY, null),
      loadShared(PARTICIPANTS_KEY, []),
      loadPersonal(ME_KEY, null),
    ]);
    setChallenge(ch);
    setParticipants(parts);
    if(localMe && parts.find(p=>p.id===localMe.id)){
      setMeId(localMe.id);
      setPhase("app");
    } else {
      setPhase("landing");
    }
  }

  useEffect(()=>{
    if(phase!=="app") return;
    const t = setInterval(async ()=>{
      const [ch, parts] = await Promise.all([loadShared(CHALLENGE_KEY,null), loadShared(PARTICIPANTS_KEY,[])]);
      if(ch) setChallenge(ch);
      setParticipants(parts);
    }, 8000);
    return ()=>clearInterval(t);
  }, [phase]);

  const day = computeDay(challenge);

  useEffect(()=>{
    if(!meId) return;
    (async ()=>{
      const cl = await loadShared(CHECKLIST_KEY_FOR(meId, day), null);
      setChecklist(cl || freshChecklist());
      const pf = await loadShared(PROOF_KEY_FOR(meId), []);
      setProof(pf);
      const a = await loadShared(AUDIT_KEY_FOR(day), null);
      setAudit(a);
    })();
  }, [meId, day]);

  const nav = (s) => setScreen(s);

  function newParticipant(id, name, mission, isAdmin, claimed){
    return { id, name: name.trim(), initials: initials(name), status:"active", eliminatedDay:null, eliminatedReason:null, streak:0, compliance:100, mission: (mission||"").trim(), missionProgress:0, leadership:60, isAdmin, claimed, joinedAt: Date.now() };
  }

  async function handleCreate({yourName, groupName, days, rosterNames}){
    const adminId = uid();
    const admin = newParticipant(adminId, yourName, "", true, true);
    const prefilled = rosterNames
      .map(n=>n.trim())
      .filter(n=>n && n.toLowerCase()!==yourName.trim().toLowerCase())
      .map(n=>newParticipant(uid(), n, "", false, false));
    const ch = { name: groupName.trim() || "The Foundry", inviteCode: randomCode(), createdAt: Date.now(), totalDays: Number(days) };
    const allParticipants = [admin, ...prefilled];
    await saveShared(CHALLENGE_KEY, ch);
    await saveShared(PARTICIPANTS_KEY, allParticipants);
    await savePersonal(ME_KEY, {id: adminId});
    setChallenge(ch); setParticipants(allParticipants); setMeId(adminId); setPhase("app"); setScreen("dashboard");
  }

  async function handleJoin({code, yourName, mission}){
    const ch = await loadShared(CHALLENGE_KEY, null);
    if(!ch || ch.inviteCode.toUpperCase() !== code.trim().toUpperCase()){
      return {error: "Invite code not found. Double-check with whoever created the Crucible."};
    }
    const parts = await loadShared(PARTICIPANTS_KEY, []);
    const nameLower = yourName.trim().toLowerCase();
    const unclaimedMatch = parts.find(p=>!p.claimed && p.name.toLowerCase()===nameLower);
    let updated, myId;

    if(unclaimedMatch){
      // claim the spot the admin already added for you
      myId = unclaimedMatch.id;
      updated = parts.map(p=>p.id===myId ? {...p, claimed:true, mission: mission ? mission.trim() : p.mission} : p);
    } else {
      if(parts.find(p=>p.claimed && p.name.toLowerCase()===nameLower)){
        return {error: "Someone with that name already joined — try a last initial."};
      }
      myId = uid();
      const me = newParticipant(myId, yourName, mission, false, true);
      updated = [...parts, me];
    }

    await saveShared(PARTICIPANTS_KEY, updated);
    await savePersonal(ME_KEY, {id: myId});
    setChallenge(ch); setParticipants(updated); setMeId(myId); setPhase("app"); setScreen("dashboard");
    return {ok:true};
  }

  async function updateParticipant(id, patch){
    const fresh = await loadShared(PARTICIPANTS_KEY, participants);
    const updated = fresh.map(p=>p.id===id?{...p,...patch}:p);
    await saveShared(PARTICIPANTS_KEY, updated);
    setParticipants(updated);
    return updated;
  }

  async function toggleChecklistItem(itemId){
    const updated = checklist.map(c=>c.id===itemId?{...c,done:!c.done}:c);
    setChecklist(updated);
    await saveShared(CHECKLIST_KEY_FOR(meId, day), updated);
    const doneCount = updated.filter(c=>c.done).length;
    await updateParticipant(meId, {compliance: Math.round((doneCount/updated.length)*100)});
  }

  async function addProofEntry(entry){
    const updated = [{day, ...entry}, ...proof];
    setProof(updated);
    await saveShared(PROOF_KEY_FOR(meId), updated);
  }

  async function setMission(missionText){
    await updateParticipant(meId, {mission: missionText.trim()});
  }

  async function logMissionProgress(note, bump){
    const me = participants.find(p=>p.id===meId);
    const newPct = Math.max(0, Math.min(100, (me.missionProgress||0) + Number(bump)));
    await updateParticipant(meId, {missionProgress: newPct});
    await addProofEntry({type:"Mission", note});
  }

  async function runAudit(){
    const fresh = await loadShared(PARTICIPANTS_KEY, participants);
    const active = fresh.filter(p=>p.status==="active");
    if(active.length===0) return null;
    const pick = active[Math.floor(Math.random()*active.length)];
    const a = { day, selectedId: pick.id, status:"pending", deadline: Date.now()+2*3600*1000 };
    await saveShared(AUDIT_KEY_FOR(day), a);
    setAudit(a);
    setParticipants(fresh);
    return pick;
  }

  async function resolveAudit(decision){
    if(!audit) return;
    if(decision==="eliminated"){
      await updateParticipant(audit.selectedId, {status:"eliminated", eliminatedDay: day, eliminatedReason:"Failed random audit — proof did not meet standard"});
    }
    const a = {...audit, status:"resolved", decision};
    await saveShared(AUDIT_KEY_FOR(day), a);
    setAudit(a);
    setAuditSelected(null);
    nav("dashboard");
  }

  async function switchIdentity(){
    await savePersonal(ME_KEY, null);
    setMeId(null); setPhase("landing"); setScreen("dashboard");
  }

  if(phase==="loading") return <div className="app-shell"><Loading/></div>;
  if(phase==="landing") return <div className="app-shell"><Landing onCreate={()=>setPhase("create")} onJoin={()=>setPhase("join")}/></div>;
  if(phase==="create") return <div className="app-shell"><CreateChallenge onBack={()=>setPhase("landing")} onCreate={handleCreate}/></div>;
  if(phase==="join") return <div className="app-shell"><JoinChallenge onBack={()=>setPhase("landing")} onJoin={handleJoin}/></div>;

  const me = participants.find(p=>p.id===meId);
  if(!me) return <div className="app-shell"><Loading/></div>;

  const NAV_ITEMS = [
    {key:"dashboard", label:"Base", icon:ICONS.dash},
    {key:"checklist", label:"Standard", icon:ICONS.check},
    {key:"roster", label:"Roster", icon:ICONS.users},
    {key:"leaderboard", label:"Ranks", icon:ICONS.trophy},
    {key:"rules", label:"Rules", icon:ICONS.shield},
    {key:"profile", label:"Profile", icon:ICONS.gear},
  ];

  let body;
  if(screen==="dashboard") body = <Dashboard challenge={challenge} participants={participants} day={day} checklist={checklist} nav={nav} me={me} audit={audit}/>;
  else if(screen==="checklist") body = <Checklist checklist={checklist} onToggle={toggleChecklistItem} onBack={()=>nav("dashboard")}/>;
  else if(screen==="mission") body = <Mission me={me} proof={proof} onSetMission={setMission} onLogProgress={logMissionProgress} onBack={()=>nav("dashboard")}/>;
  else if(screen==="vault") body = <Vault proof={proof} onAdd={addProofEntry} onBack={()=>nav("dashboard")}/>;
  else if(screen==="audit") body = <AuditDraw participants={participants} onBack={()=>nav("dashboard")} onDraw={runAudit} existingAudit={audit} onGoReview={(p)=>{setAuditSelected(p); nav("adminReview");}}/>;
  else if(screen==="adminReview") body = <AdminReview selected={auditSelected || (audit && participants.find(p=>p.id===audit.selectedId))} onBack={()=>nav("audit")} onResolved={resolveAudit}/>;
  else if(screen==="roster") body = <Roster participants={participants} onBack={()=>nav("dashboard")}/>;
  else if(screen==="leaderboard") body = <Leaderboard participants={participants} onBack={()=>nav("dashboard")}/>;
  else if(screen==="challengeDay") body = <ChallengeDayScreen day={day} onBack={()=>nav("dashboard")}/>;
  else if(screen==="rules") body = <RulesScreen onBack={()=>nav("dashboard")}/>;
  else if(screen==="podium") body = <Podium participants={participants} onBack={()=>nav("dashboard")}/>;
  else if(screen==="profile") body = <Profile me={me} participants={participants} onBack={()=>nav("dashboard")} onSwitch={switchIdentity}/>;

  const mainNavKeys = NAV_ITEMS.map(n=>n.key);
  const showBottomNav = mainNavKeys.includes(screen);

  return (
    <div className="app-shell">
      <div className="main-scroll" style={{paddingBottom: showBottomNav ? 90 : 20}}>
        {body}
        {screen==="dashboard" && (
          <div style={{padding:"0 20px 20px"}}>
            <button className="btn btn-ghost" style={{width:"100%", textAlign:"center", border:"1px dashed var(--steel)"}} onClick={()=>nav("podium")}>DEMO: VIEW FINAL PODIUM →</button>
          </div>
        )}
      </div>
      {showBottomNav && (
        <div className="bottomnav">
          {NAV_ITEMS.map(item=>(
            <button key={item.key} className={`nav-tab ${screen===item.key?"active":""}`} onClick={()=>nav(item.key)}>
              <Icon d={item.icon} size={19} strokeWidth={1.7}/>
              <span className="tab-label">{item.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
